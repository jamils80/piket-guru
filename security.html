<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Security Gerbang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-color: #0b132b;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, rgba(11, 19, 43, 0.78), rgba(28, 37, 65, 0.72)),
                  url('https://lh3.googleusercontent.com/d/1Vo2a5qqGEPQm3XzyB0-qZr9NdBvNtXGX') center/cover no-repeat;
      z-index: -1;
      animation: securityBgShift 22s linear infinite alternate;
    }
    @keyframes securityBgShift {
      0% { transform: scale(1.04) translateX(-1%); }
      100% { transform: scale(1.04) translateX(1%); }
    }
    .card {
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      animation: slideFromLeft 0.7s ease-out both;
    }
    .card:nth-of-type(2) {
      animation: slideFromRight 0.7s ease-out 0.15s both;
    }
    @keyframes slideFromLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideFromRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .card-header.bg-primary {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0d6efd, #003566) !important;
    }
    .card-header.bg-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transform: skewX(-25deg);
      animation: radarSweep 4s infinite;
    }
    @keyframes radarSweep {
      0% { left: -100%; }
      50%, 100% { left: 160%; }
    }
    .logo-beranda {
      max-width: 240px;
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      animation: shieldHeartbeat 3.2s ease-in-out infinite;
    }
    @keyframes shieldHeartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body class="p-3">
  <div class="container" style="max-width: 600px;">
    <!-- FORM PENGAJUAN IZIN MASUK BY SECURITY -->
    <div class="card shadow mb-4 border-0" style="border-radius: 16px;">
      <div class="card-header bg-primary text-white text-center py-4" style="border-radius: 16px 16px 0 0;">
        <div id="logoContainer">
          <img src="https://lh3.googleusercontent.com/d/1gj5Xy_Gk9UHulau-_vf3IZuYlQtQN6Jz" class="logo-beranda" style="max-height: 75px; width: auto;" alt="Logo SMKN 1 Purwoasri">
        </div>
        <h5 class="mb-0 fw-bold text-uppercase">🛡️ Form Pengajuan Izin Masuk (Security)</h5>
      </div>
      <div class="card-body p-4">
        <!-- BAR STATUS SECURITY AKTIF, UBAH PASSWORD & LOGOUT -->
        <div class="d-flex flex-wrap justify-content-between align-items-center bg-light border rounded-3 p-2 mb-3 gap-2">
          <div class="small">
            🛡️ Security: <strong id="labelPetugasAktif" class="text-primary">-</strong>
          </div>
          <div class="d-flex gap-1">
            <button type="button" class="btn btn-sm btn-warning fw-bold" onclick="dialogUbahPasswordPetugas()">
              🔑 Ubah Password
            </button>
            <button type="button" class="btn btn-sm btn-danger fw-bold" onclick="logoutPetugas()">
              🚪 Logout
            </button>
          </div>
        </div>

        <form id="formSecurity">
          <div class="mb-3">
            <label class="form-label fw-bold">Nama Security / Petugas</label>
            <select class="form-select border-primary bg-light fw-semibold" id="namaPetugas" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Kelas / Jurusan</label>
            <select class="form-select" id="kelas" onchange="loadSiswa()" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Nama Siswa</label>
            <select class="form-select" id="nama" disabled required></select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Jenis Izin Masuk</label>
            <select class="form-select" id="jenisIzin" required>
              <option value="Izin Masuk (Terlambat)">Izin Masuk (Terlambat)</option>
              <option value="Izin Masuk (Alasan Lain)">Izin Masuk (Alasan Lain)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Alasan / Keterangan Terlambat</label>
            <textarea class="form-control" id="alasan" rows="3" required></textarea>
          </div>
          <button type="submit" id="btnSubmitSecurity" class="btn btn-primary w-100 py-2 fw-bold">Kirim Pengajuan Izin Masuk</button>
        </form>
      </div>
    </div>

    <!-- TABEL RIWAYAT & VERIFIKASI SELESAI -->
    <div class="card shadow mb-4 border-0" style="border-radius: 16px;">
      <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center" style="border-radius: 16px 16px 0 0;">
        <span class="fw-bold">📋 Verifikasi Perizinan Gerbang</span>
        <button class="btn btn-sm btn-light fw-bold" onclick="loadRiwayat()">🔄 Refresh</button>
      </div>
      <div class="card-body p-3">
        <div class="table-responsive">
          <table class="table table-bordered align-middle mb-0" style="font-size:0.88rem;">
            <thead class="table-light text-center">
              <tr>
                <th>Kode & Siswa</th>
                <th>Detail</th>
                <th>Aksi / Status</th>
              </tr>
            </thead>
            <tbody id="bodyRiwayat">
              <tr><td colspan="3" class="text-center text-muted">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztosb_1Ihgkw411vgyoDiZUHI-pQgq4qv07KtLQ2QZhaHTg2222IlaeVQuc-7Z8k8jjw/exec";
    const SESI_KEY = "sesiSecurity";

    let petugasAktif = null;

    window.onload = function() {
      // Wajib punya sesi login dari index.html; jika belum, kembalikan ke index.html
      const saved = sessionStorage.getItem(SESI_KEY);
      if (!saved) {
        Swal.fire({
          icon: 'warning',
          title: 'Akses Terbatas',
          text: 'Silakan login terlebih dahulu melalui Verifikasi Pos Security di halaman utama.',
          confirmButtonText: 'Ke Halaman Login',
          allowOutsideClick: false
        }).then(() => {
          window.location.href = "index.html";
        });
        return;
      }

      petugasAktif = JSON.parse(saved);
      document.getElementById('labelPetugasAktif').innerText = petugasAktif.nama;
      const gSel = document.getElementById('namaPetugas');
      gSel.innerHTML = `<option value="${petugasAktif.nama}" selected>${petugasAktif.nama}</option>`;

      // Sinkronisasi Logo dari Server
      fetch(`${WEB_APP_URL}?action=getAppAssets`)
        .then(res => res.json())
        .then(assets => {
          if (assets && assets.logoBeranda) {
            document.getElementById('logoContainer').innerHTML = `<img src="${assets.logoBeranda}" class="logo-beranda" alt="Logo">`;
          }
        }).catch(() => {});

      // Muat Master Kelas
      fetch(`${WEB_APP_URL}?action=getMasterData`)
        .then(r => r.json())
        .then(data => {
          const kSel = document.getElementById('kelas');
          kSel.innerHTML = '<option value="" selected disabled>Pilih Kelas...</option>';
          (data.kelas || []).forEach(k => { kSel.innerHTML += `<option value="${k}">${k}</option>`; });
        });

      loadRiwayat();
    };

    function logoutPetugas() {
      Swal.fire({
        title: 'Logout dari Pos Security?',
        text: 'Anda harus memasukkan kembali user dan password security untuk masuk lagi.',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Ya, Logout',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) {
          sessionStorage.removeItem(SESI_KEY);
          window.location.href = "index.html";
        }
      });
    }

    async function dialogUbahPasswordPetugas() {
      if (!petugasAktif) return;
      const { value: formPass } = await Swal.fire({
        title: '🔑 Ubah Password Security',
        html: `
          <div class="text-start">
            <div class="mb-2 small">Akun: <b>${petugasAktif.nama}</b></div>
            <label class="form-label small fw-bold">Password Lama</label>
            <input type="password" id="passLamaInput" class="form-control mb-3" placeholder="Password lama (default: 123456)">
            <label class="form-label small fw-bold">Password Baru</label>
            <input type="password" id="passBaruInput" class="form-control mb-3" placeholder="Minimal 4 karakter">
            <label class="form-label small fw-bold">Konfirmasi Password Baru</label>
            <input type="password" id="passKonfirmInput" class="form-control" placeholder="Ulangi password baru">
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: 'Simpan Password Baru',
        cancelButtonText: 'Batal',
        preConfirm: () => {
          const lama = document.getElementById('passLamaInput').value;
          const baru = document.getElementById('passBaruInput').value;
          const konf = document.getElementById('passKonfirmInput').value;
          if (!lama || !baru || !konf) {
            Swal.showValidationMessage('Semua kolom password wajib diisi!');
            return false;
          }
          if (baru !== konf) {
            Swal.showValidationMessage('Konfirmasi password baru tidak cocok!');
            return false;
          }
          return { lama, baru };
        }
      });

      if (!formPass) return;

      Swal.fire({ title: 'Menyimpan Password...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: "ubahPasswordPetugas",
          nama: petugasAktif.nama,
          passwordLama: formPass.lama,
          passwordBaru: formPass.baru
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          Swal.fire('Berhasil!', res.message, 'success');
        } else {
          Swal.fire('Gagal', res.message, 'error');
        }
      });
    }

    function loadSiswa() {
      const kelas = document.getElementById('kelas').value;
      const sSel = document.getElementById('nama');
      sSel.disabled = true;

      fetch(`${WEB_APP_URL}?action=getSiswaByKelas&kelas=${encodeURIComponent(kelas)}`)
        .then(res => res.json())
        .then(list => {
          sSel.innerHTML = '<option value="" selected disabled>-- Pilih Nama Siswa --</option>';
          list.forEach(s => { sSel.innerHTML += `<option value="${s}">${s}</option>`; });
          sSel.disabled = false;
        });
    }

    document.getElementById('formSecurity').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitSecurity');
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      const payload = {
        action: "simpanPengajuanGuruKelas",
        petugas: petugasAktif.nama,
        kelas: document.getElementById('kelas').value,
        nama: document.getElementById('nama').value,
        jenisIzin: document.getElementById('jenisIzin').value,
        alasan: document.getElementById('alasan').value
      };

      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          btn.disabled = false;
          btn.innerText = "Kirim Pengajuan Izin Masuk";

          if (res.success === false) {
            Swal.fire('Peringatan Jadwal', res.message, 'warning');
            return;
          }
          Swal.fire('Berhasil!', 'Pengajuan izin masuk dikirim. Kode ID: ' + res.id, 'success');
          document.getElementById('formSecurity').reset();
          document.getElementById('namaPetugas').innerHTML = `<option value="${petugasAktif.nama}" selected>${petugasAktif.nama}</option>`;
          document.getElementById('nama').disabled = true;
          loadRiwayat();
        })
        .catch(() => {
          btn.disabled = false;
          btn.innerText = "Kirim Pengajuan Izin Masuk";
          Swal.fire('Error', 'Terjadi kesalahan jaringan saat mengirim pengajuan.', 'error');
        });
    });

    function loadRiwayat() {
      fetch(`${WEB_APP_URL}?action=getRiwayatIzinGuru&_t=${new Date().getTime()}`)
        .then(res => res.json())
        .then(list => {
          const tbody = document.getElementById('bodyRiwayat');
          if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Belum ada data.</td></tr>';
            return;
          }

          list = list.filter(item => (item.status || '').toLowerCase().indexOf('selesai') === -1);

          let html = '';
          list.forEach(item => {
            let statusBtn = '';
            if ((item.status || '').toLowerCase().indexOf('disetujui') !== -1) {
              statusBtn = `<button class="btn btn-sm btn-success fw-bold" onclick="markSelesai('${item.id}')">✓ Verifikasi Selesai</button>`;
            } else {
              statusBtn = `<span class="badge bg-warning text-dark">Menunggu Piket</span>`;
            }

            html += `<tr>
              <td><span class="badge bg-primary">${item.id}</span><br><strong>${item.nama}</strong><br><small>${item.kelas}</small></td>
              <td><small>${item.jenisIzin}<br>${item.alasan}</small></td>
              <td class="text-center">${statusBtn}</td>
            </tr>`;
          });
          tbody.innerHTML = html || '<tr><td colspan="3" class="text-center text-muted">Semua perizinan telah selesai.</td></tr>';
        });
    }

    function markSelesai(idIzin) {
      Swal.fire({
        title: 'Memverifikasi...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "konfirmasiSelesaiIzin", idIzin: idIzin, namaPetugas: petugasAktif.nama })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success === false) {
          Swal.fire('Peringatan Jadwal', res.message, 'warning');
          return;
        }
        Swal.fire('Berhasil!', res.message, 'success');
        loadRiwayat();
      })
      .catch(() => {
        Swal.fire('Error', 'Gagal memverifikasi perizinan.', 'error');
      });
    }
  </script>
</body>
</html>
