<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengajuan Guru Kelas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-color: #081c15;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(8, 28, 21, 0.76), rgba(27, 67, 50, 0.68)),
                  url('https://lh3.googleusercontent.com/d/1Vo2a5qqGEPQm3XzyB0-qZr9NdBvNtXGX') center/cover no-repeat;
      z-index: -1;
      animation: guruZoomSlow 26s ease-in-out infinite alternate;
    }
    @keyframes guruZoomSlow {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.07) translateY(-1.5%); }
    }
    .card {
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      animation: zoomReveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes zoomReveal {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .card-header.bg-success {
      background: linear-gradient(-45deg, #198754, #2d6a4f, #40916c, #198754) !important;
      background-size: 300% 300% !important;
      animation: greenWaveGradient 8s ease infinite;
    }
    @keyframes greenWaveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .logo-beranda {
      max-width: 240px;
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      transition: transform 0.3s ease;
    }
    .logo-beranda:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="p-3" style="background:#f8f9fa;">
  <div class="container" style="max-width: 600px;">
    <div class="card shadow mb-4 border-0" style="border-radius: 16px;">
      <div class="card-header bg-success text-white text-center py-4" style="border-radius: 16px 16px 0 0;">
        <div id="logoContainer">
          <img src="https://lh3.googleusercontent.com/d/1gj5Xy_Gk9UHulau-_vf3IZuYlQtQN6Jz" class="logo-beranda" style="max-height: 75px; width: auto;" alt="Logo SMKN 1 Purwoasri">
        </div>
        <h5 class="mb-1 fw-bold text-uppercase">Form Pengajuan Izin Keluar</h5>
        <small>Pengajuan Guru Pengajar ke Guru Piket</small>
      </div>
      <div class="card-body p-4">
        <form id="formGuruKelas">
          <div class="mb-3">
            <label class="form-label fw-bold">Nama Guru Pengajar</label>
            <select class="form-select border-success" id="namaPetugas" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Kelas / Jurusan</label>
            <select class="form-select" id="kelas" onchange="loadSiswa()" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Nama Siswa</label>
            <select class="form-select" id="nama" disabled required></select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Jenis Izin</label>
            <select class="form-select" id="jenisIzin" required>
              <option value="Izin Keluar (Sakit/UKS)">Izin Keluar (Sakit/UKS)</option>
              <option value="Izin Keluar (Keperluan Lain)">Izin Keluar (Keperluan Lain)</option>
              <option value="Izin Keluar (Tugas Sekolah)">Izin Keluar (Tugas Sekolah)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Alasan / Keterangan Izin</label>
            <textarea class="form-control" id="alasan" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Kirim Pengajuan Izin Keluar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztosb_1Ihgkw411vgyoDiZUHI-pQgq4qv07KtLQ2QZhaHTg2222IlaeVQuc-7Z8k8jjw/exec";

    window.onload = function() {
      // Sinkronisasi Logo dari Server (jika ada pembaruan di sheet Assets)
      fetch(`${WEB_APP_URL}?action=getAppAssets`)
        .then(res => res.json())
        .then(assets => {
          if (assets && assets.logoBeranda) {
            document.getElementById('logoContainer').innerHTML = `<img src="${assets.logoBeranda}" class="logo-beranda" alt="Logo">`;
          }
        })
        .catch(() => {});

      // Fetch Master Data
      fetch(`${WEB_APP_URL}?action=getMasterData`)
        .then(res => res.json())
        .then(data => {
          const gSel = document.getElementById('namaPetugas');
          gSel.innerHTML = '<option value="" selected disabled>Pilih Nama Guru...</option>';
          data.guru.forEach(g => { gSel.innerHTML += `<option value="${g}">${g}</option>`; });

          const kSel = document.getElementById('kelas');
          kSel.innerHTML = '<option value="" selected disabled>Pilih Kelas...</option>';
          data.kelas.forEach(k => { kSel.innerHTML += `<option value="${k}">${k}</option>`; });
        });
    };

    function loadSiswa() {
      const kelas = document.getElementById('kelas').value;
      const sSel = document.getElementById('nama');
      sSel.disabled = true;

      fetch(`${WEB_APP_URL}?action=getSiswaByKelas&kelas=${encodeURIComponent(kelas)}`)
        .then(res => res.json())
        .then(list => {
          sSel.innerHTML = '<option value="" selected disabled>-- Pilih Nama Siswa --</option>';
          list.forEach(s => { sSel.innerHTML += `<option value="${s}">${s}</option>`; });
          sSel.disabled = false;
        });
    }

    document.getElementById('formGuruKelas').addEventListener('submit', function(e) {
      e.preventDefault();
      const payload = {
        action: "simpanPengajuanGuruKelas",
        petugas: document.getElementById('namaPetugas').value,
        kelas: document.getElementById('kelas').value,
        nama: document.getElementById('nama').value,
        jenisIzin: document.getElementById('jenisIzin').value,
        alasan: document.getElementById('alasan').value
      };

      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          Swal.fire('Berhasil!', 'Pengajuan terkirim. Kode ID: ' + res.id, 'success');
          document.getElementById('formGuruKelas').reset();
        });
    });
  </script>
</body>
</html>
